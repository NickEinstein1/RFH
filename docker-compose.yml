services:
  postgres:
    image: postgres:16-alpine
    container_name: rfh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfh
      POSTGRES_PASSWORD: rfh_dev_password
      POSTGRES_DB: rfh_system
    ports:
      - "5432:5432"
    volumes:
      - rfh_pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "ssl=off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfh -d rfh_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfh_pg_data:
