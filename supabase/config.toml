# RFH Care — Supabase project (Postgres host for Nest + Prisma)
# Auth/API stay in Nest. Supabase provides managed PostgreSQL + Studio.

project_id = "rfh-care"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = false
